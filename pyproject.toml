[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcmsim"
version = "0.3.14"
description = "Local DICOM troubleshooting tool"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "pydicom>=3.0,<4",
  "pynetdicom>=3.0,<4",
  "pillow>=10,<13",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps/api/app"]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
pythonpath = ["apps/api"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]
