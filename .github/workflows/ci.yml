name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -e ".[dev]"
      - run: ruff check apps/api
      - run: python -m compileall -q apps/api/app
      - run: pytest apps/api/tests/unit
      - run: pytest apps/api/tests/integration
      - run: pytest apps/api/tests/dicom
      - name: Verify migrations on empty database
        env: {DCMSIM_DATABASE_URL: 'sqlite:///./migration-check.db'}
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: apps/web/playwright-report}

  full-stack-smoke:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: pip install -e "../..[dev]"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:full-stack
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: full-stack-playwright-report, path: apps/web/playwright-report}

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify localhost-only default
        run: docker compose config --format json | python3 -c 'import json,sys; ports=json.load(sys.stdin)["services"]["dcmsim"]["ports"]; assert len(ports)==1 and ports[0]["host_ip"]=="127.0.0.1"'
      - name: Verify explicit private-host override
        run: DCMSIM_PUBLISH_HOST=192.0.2.10 docker compose config --format json | python3 -c 'import json,sys; ports=json.load(sys.stdin)["services"]["dcmsim"]["ports"]; assert len(ports)==1 and ports[0]["host_ip"]=="192.0.2.10"'
      - name: Verify runtime settings reach the container
        run: DCMSIM_CONNECT_TIMEOUT=7.5 DCMSIM_ASSOCIATION_TIMEOUT=12 DCMSIM_DIMSE_TIMEOUT=30 DCMSIM_LOG_LEVEL=WARNING docker compose config --format json | python3 -c 'import json,sys; env=json.load(sys.stdin)["services"]["dcmsim"]["environment"]; assert {key:env[key] for key in ("DCMSIM_CONNECT_TIMEOUT","DCMSIM_ASSOCIATION_TIMEOUT","DCMSIM_DIMSE_TIMEOUT","DCMSIM_LOG_LEVEL")} == {"DCMSIM_CONNECT_TIMEOUT":"7.5","DCMSIM_ASSOCIATION_TIMEOUT":"12","DCMSIM_DIMSE_TIMEOUT":"30","DCMSIM_LOG_LEVEL":"WARNING"}'
      - run: docker build -t dcmsim:ci .
      - name: Verify container readiness
        run: |
          docker run -d --name dcmsim-health-ci -p 127.0.0.1:18080:8080 dcmsim:ci
          for attempt in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' dcmsim-health-ci)
            if [ "$status" = healthy ]; then
              curl -fsS http://127.0.0.1:18080/api/ready
              exit 0
            fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 2
          done
          docker logs dcmsim-health-ci
          exit 1
      - name: Verify outbound DICOM from container
        run: |
          docker network create dcmsim-dicom-ci
          docker network connect dcmsim-dicom-ci dcmsim-health-ci
          docker run -d --name dcmsim-echo-scp --network dcmsim-dicom-ci dcmsim:ci python apps/api/tests/docker/echo_scp.py
          for attempt in $(seq 1 20); do
            if docker exec dcmsim-health-ci python -c 'import socket; socket.create_connection(("dcmsim-echo-scp", 11112), timeout=1).close()'; then break; fi
            sleep 1
          done
          curl -fsS -X POST http://127.0.0.1:18080/api/dicom/echo \
            -H 'Content-Type: application/json' \
            --data '{"host":"dcmsim-echo-scp","port":11112,"called_ae":"TESTSCP","calling_ae":"DCMSIM"}' \
            | python3 -c 'import json,sys; result=json.load(sys.stdin); assert result["success"] is True and result["status"] == "0x0000", result'
      - name: Remove test container
        if: always()
        run: |
          docker rm -f dcmsim-echo-scp dcmsim-health-ci || true
          docker network rm dcmsim-dicom-ci || true
