# Basic Auth ist das vollständig lauffähige Beispiel. Für LDAP/AD kann die
# Authentisierung durch einen internen auth_request-Dienst ersetzt werden.
server {
    listen 443 ssl;
    server_name dcmsim.klinik.example;
    ssl_certificate /etc/ssl/certs/dcmsim.crt;
    ssl_certificate_key /etc/ssl/private/dcmsim.key;

    # Zusätzlich den Zugriff per Firewall auf das Admin-Netz beschränken.
    auth_basic "DCMSim";
    auth_basic_user_file /etc/nginx/dcmsim.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-User $remote_user;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name dcmsim.klinik.example;
    return 301 https://$host$request_uri;
}
